<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts: Fraunces for headings, Inter Tight for body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter+Tight:wght@400..700&display=swap"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Theme: each --color-x / --font-x becomes Tailwind classes like bg-paper, text-ink, font-display -->
    <style type="text/tailwindcss">
      @theme {
        --font-display: "Fraunces", Georgia, serif;
        --font-sans: "Inter Tight", system-ui, sans-serif;

        --color-paper: #faf6ef;
        --color-ink: #2b2622;
        --color-muted: #6b6259;
        --color-line: #e4dccf;
        --color-paprika: #b4441f;
        --color-paprika-dark: #963817;
      }

      @layer base {
        body {
          @apply bg-paper font-sans leading-relaxed text-ink;
        }
      }
    </style>

    <title>Recipe Discovery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
